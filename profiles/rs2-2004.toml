[profile]
input = "ref/gamepack.jar"

[profile.deob]
enable = true

transformers = [
    "AnnotateObfuscatedNames",
    "SortClassesLegacy",
    "ClassLiteral",
    "InvokeSpecial",
    "MultipleAssignment",
    "UniqueRenamer",

    "OpaquePredicate",
    "ExceptionObfuscation",
    "ExceptionTracing",
    "Monitor",

    "BitShift",
    "Visibility",
    "RedundantGoto",
    "FernflowerException",

    "VariableSplitter"
]

[profile.remap]
enable = true

[profile.source]
decompile = true
cleanup = true

transformers = [
    "Unenclose",
    "NegativeLiteral",
    "Complement",
    "Not",
    "IfElse",
    "Ternary",
    "BinaryExprOrder",
    "Identity",
    "BitMask",
    "HexLiteral",
    "ValueOf",
    "NewInstance",
    "Increment",
    "ForLoopCondition",
    "RedundantCast",
    "Enclose"
]
